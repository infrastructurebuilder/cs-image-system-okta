# REUSE (https://reuse.software) declarations for the files that carry no header of
# their own: the instance suite's fixture and golden (a golden must equal the emission byte
# for byte), prose, the lock file, JSON and marker files. Every other source file
# carries the SPDX two-liner; `just lint` runs `reuse lint`.
version = 1

[[annotations]]
path = [
  "tests/instance/fixture/**",
  "tests/instance/golden/**",
  "docs/**",
  "**/*.md",
  "uv.lock",
  ".gitignore",
  "**/*.json",
  "*.code-workspace",
  "**/py.typed",
  ".claude/CLAUDE.md",
  ".vscode/**",
  "specs/**",
  ".specify/memory/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Mykel Alvis <mykelalvis@infrastructurebuilder.org>"
SPDX-License-Identifier = "Apache-2.0"

# Spec Kit's own files, as `specify init` wrote them: its scripts, templates and
# workflow under .specify/ and its skills under .claude/skills/. They are GitHub's,
# under the MIT licence. The constitution (.specify/memory/) is this project's, above.
[[annotations]]
path = [
  ".specify/.gitignore",
  ".specify/*.json",
  ".specify/integrations/**",
  ".specify/scripts/**",
  ".specify/templates/**",
  ".specify/workflows/**",
  ".claude/skills/speckit-*/**",
]
precedence = "override"
SPDX-FileCopyrightText = "GitHub, Inc."
SPDX-License-Identifier = "MIT"
