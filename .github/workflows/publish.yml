name: Publish

# A pushed `v<version>` tag publishes that version of the plugin, by PyPI's
# trusted publishing: the index trusts this repository, this workflow file and
# the job's GitHub environment, and the job proves it is them with a short-lived
# OIDC token. No upload token is stored anywhere, here or in the repository's
# secrets. docs/RELEASING.md says how the trust is set up, on both indexes and
# in the repository's environments, and what a fork must change.
#
# TestPyPI only, for every version, until 1.0 (cs-image-system-3 specification
# 013): nothing here uploads to PyPI. A file the index already holds is skipped
# (`uv publish --index` checks the index it publishes to), so a version the
# operator uploaded by hand, or a rerun after a partial failure, is checked
# rather than uploaded twice. tests/tooling/test_publish_commands_parse.py holds
# every `uv publish` line here to one uv accepts.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    # only the repository the indexes trust publishes; a fork names its own here (docs/RELEASING.md)
    if: github.repository == 'infrastructurebuilder/cs-image-system-okta'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: The tag is the plugin's version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' packages/okta-opa-plugin/pyproject.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "publish: the tag $GITHUB_REF_NAME is not the plugin's version ($version)"; exit 1; }
          echo "publish: $version, to TestPyPI"

      - name: Build
        run: uv build --all-packages

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write          # the OIDC token TestPyPI's trusted publisher checks
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        run: uv publish --trusted-publishing always --index testpypi dist/*
